name: Databricks Bundle CD

on:
  workflow_dispatch:
    inputs:
      previous_manifest_asset:
        description: "Test-only previous deployment manifest asset"
        required: false
        type: string
        default: ""
      release_id:
        description: "Release ID in format rc-YYYYMMDD-GITHUB_RUN_ID, for example rc-20260731-123456789"
        required: true
        type: string
      target_environment:
        description: Target deployment environment
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

# Do not cancel an active deployment when another deployment is dispatched.
concurrency:
  group: databricks-cd
  cancel-in-progress: false
  queue: max

permissions: {}

env:
  BUNDLE_NAME: databricks-cicd-bundle-poc
  RELEASE_DIR: release-package
  BUNDLE_DIR: bundle-source
  EVIDENCE_DIR: deployment-evidence
  DEPLOY_TIMEOUT_SECONDS: "2700"

jobs:
  resolve-context:
    name: Resolve CD Context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target_environment: ${{ steps.context.outputs.target_environment }}
      release_id: ${{ steps.context.outputs.release_id }}
      bundle_target: ${{ steps.context.outputs.bundle_target }}
      github_environment: ${{ steps.context.outputs.github_environment }}
      workspace_target: ${{ steps.context.outputs.workspace_target }}
      previous_environment: ${{ steps.context.outputs.previous_environment }}
      selected_previous_manifest_asset: ${{ steps.context.outputs.selected_previous_manifest_asset }}
      previous_manifest_path: ${{ steps.context.outputs.previous_manifest_path }}
      canonical_manifest_name: ${{ steps.names.outputs.canonical_manifest_name }}
      historical_manifest_name: ${{ steps.names.outputs.historical_manifest_name }}
      target_branch: ${{ steps.names.outputs.target_branch }}
    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@v4

      - name: Resolve CD context
        id: context
        shell: bash
        env:
          INPUT_PREVIOUS_MANIFEST_ASSET: ${{ inputs.previous_manifest_asset }}
        run: |
          set -euo pipefail
      
          chmod +x scripts/cd_resolve_context.sh
      
          context_output="$(
            scripts/cd_resolve_context.sh \
              "${{ inputs.target_environment }}" \
              "${{ inputs.release_id }}"
          )"
      
          printf '%s\n' "$context_output" >> "$GITHUB_OUTPUT"
      
          default_previous_manifest_path="$(
            printf '%s\n' "$context_output" |
            awk -F= '$1 == "previous_manifest_path" { print $2 }'
          )"
      
          previous_manifest_asset="$INPUT_PREVIOUS_MANIFEST_ASSET"
      
          if [[ -z "$previous_manifest_asset" ]]; then
            previous_manifest_asset="$default_previous_manifest_path"
          fi
      
          echo "selected_previous_manifest_asset=$previous_manifest_asset" \
            >> "$GITHUB_OUTPUT"
            
      - name: Resolve orchestration names
        id: names
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ steps.context.outputs.target_environment }}
        run: |
          set -euo pipefail

          case "$TARGET_ENVIRONMENT" in
            dev)  TARGET_BRANCH="dev" ;;
            uat)  TARGET_BRANCH="qa" ;;
            prod) TARGET_BRANCH="main" ;;
            *)
              echo "Unsupported target environment: $TARGET_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

          echo "canonical_manifest_name=${TARGET_ENVIRONMENT}-deployment-manifest.json" >> "$GITHUB_OUTPUT"
          echo "historical_manifest_name=${TARGET_ENVIRONMENT}-deployment-manifest-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_OUTPUT"
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"
            
  verify-release:
    name: Verify Immutable Release
    runs-on: ubuntu-latest
    needs: resolve-context
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.verify.outputs.release_id }}
      artifact_name: ${{ steps.verify.outputs.artifact_name }}
      artifact_hash: ${{ steps.verify.outputs.artifact_hash }}
      repository: ${{ steps.verify.outputs.repository }}
      source_branch: ${{ steps.verify.outputs.source_branch }}
      commit_sha: ${{ steps.verify.outputs.commit_sha }}
    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@v4

      - name: Download immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.resolve-context.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"

          gh release download "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RELEASE_DIR" \
            --pattern "${RELEASE_ID}.zip" \
            --pattern "release_manifest.json"

          test -f "$RELEASE_DIR/${RELEASE_ID}.zip"
          test -f "$RELEASE_DIR/release_manifest.json"

      - name: Verify release manifest and artifact
        id: verify
        shell: bash
        env:
          RELEASE_ID: ${{ needs.resolve-context.outputs.release_id }}
        run: |
          set -euo pipefail
          chmod +x scripts/cd_verify_release_manifest.sh

          verification_output="$(
            scripts/cd_verify_release_manifest.sh \
              "$RELEASE_DIR/release_manifest.json" \
              "$RELEASE_ID"
          )"

          printf '%s\n' "$verification_output"
          printf '%s\n' "$verification_output" \
            | grep -E '^[a-z_]+=' \
            >> "$GITHUB_OUTPUT"

  validate-promotion:
    name: Validate Promotion
    runs-on: ubuntu-latest
    needs:
      - resolve-context
      - verify-release
    permissions:
      contents: read
    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download canonical previous-environment evidence
        if: needs.resolve-context.outputs.previous_environment != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          PREVIOUS_MANIFEST_PATH: ${{ needs.resolve-context.outputs.previous_manifest_path }}
        run: |
          set -euo pipefail

          gh release download "${{ inputs.release_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir . \
            --pattern "${{ needs.resolve-context.outputs.selected_previous_manifest_asset }}"

          test -f "$PREVIOUS_MANIFEST_PATH"

      - name: Display selected promotion evidence
        shell: bash
        run: |
          set -euo pipefail
      
          echo "Selected previous manifest:"
          echo "${{ needs.resolve-context.outputs.selected_previous_manifest_asset }}"
      
          jq '{
            environment,
            artifact_role: .evidence_storage.artifact_role,
            artifact_name: .evidence_storage.artifact_name,
            operation_status: .operation.status
          }' \
          "${{ needs.resolve-context.outputs.selected_previous_manifest_asset }}"

      - name: Run promotion validator
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ needs.resolve-context.outputs.target_environment }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          ARTIFACT_HASH: ${{ needs.verify-release.outputs.artifact_hash }}
          PREVIOUS_MANIFEST_PATH: ${{ needs.resolve-context.outputs.previous_manifest_path }}
        run: |
          set -euo pipefail

          command=(
            python scripts/promotion_validator.py \
            --target-environment "${{ needs.resolve-context.outputs.target_environment }}" \
            --release-id "${{ inputs.release_id }}" \
            --artifact-hash "${{ needs.verify-release.outputs.artifact_hash }}" \
            --previous-manifest-path \
              "${{ needs.resolve-context.outputs.selected_previous_manifest_asset }}"
              )

          if [[ -n "$PREVIOUS_MANIFEST_PATH" ]]; then
            command+=(--previous-manifest-path "$PREVIOUS_MANIFEST_PATH")
          fi

          "${command[@]}"

      - name: Confirm promotion decision
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ needs.resolve-context.outputs.target_environment }}
        run: |
          set -euo pipefail
          result_file="${TARGET_ENVIRONMENT}-promotion-validation-result.json"
          test -f "$result_file"
          jq -e '.valid == true and .decision == "PROMOTION_VALID"' "$result_file" >/dev/null
          jq '{decision, valid, target_environment, release_id, artifact_hash, previous_environment, message, checks}' "$result_file"

  deploy:
    name: Deploy and Publish Evidence
    runs-on: ubuntu-latest
    needs:
      - resolve-context
      - verify-release
      - validate-promotion
    permissions:
      contents: write
    environment: ${{ needs.resolve-context.outputs.github_environment }}
    timeout-minutes: 60
    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create working directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR" "$BUNDLE_DIR" "$EVIDENCE_DIR"

      - name: Download immutable release on deployment runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
        run: |
          set -euo pipefail

          gh release download "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RELEASE_DIR" \
            --pattern "$ARTIFACT_NAME" \
            --pattern "release_manifest.json"

          test -f "$RELEASE_DIR/$ARTIFACT_NAME"
          test -f "$RELEASE_DIR/release_manifest.json"

      - name: Reverify release on deployment runner
        id: deployment-verification
        shell: bash
        env:
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
        run: |
          set -euo pipefail
          chmod +x scripts/cd_verify_release_manifest.sh

          verification_output="$(
            scripts/cd_verify_release_manifest.sh \
              "$RELEASE_DIR/release_manifest.json" \
              "$RELEASE_ID"
          )"

          printf '%s\n' "$verification_output"
          printf '%s\n' "$verification_output" \
            | grep -E '^[a-z_]+=' \
            >> "$GITHUB_OUTPUT"

      - name: Confirm deployment artifact matches approved release
        shell: bash
        env:
          APPROVED_RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          APPROVED_ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
          APPROVED_ARTIFACT_HASH: ${{ needs.verify-release.outputs.artifact_hash }}
          ACTUAL_RELEASE_ID: ${{ steps.deployment-verification.outputs.release_id }}
          ACTUAL_ARTIFACT_NAME: ${{ steps.deployment-verification.outputs.artifact_name }}
          ACTUAL_ARTIFACT_HASH: ${{ steps.deployment-verification.outputs.artifact_hash }}
        run: |
          set -euo pipefail
          test "$ACTUAL_RELEASE_ID" = "$APPROVED_RELEASE_ID"
          test "$ACTUAL_ARTIFACT_NAME" = "$APPROVED_ARTIFACT_NAME"
          test "$ACTUAL_ARTIFACT_HASH" = "$APPROVED_ARTIFACT_HASH"

      - name: Extract immutable release artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
        run: |
          set -euo pipefail
          unzip -q "$RELEASE_DIR/$ARTIFACT_NAME" -d "$BUNDLE_DIR"
          test -f "$BUNDLE_DIR/databricks.yml"

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate authentication and resolve principal
        id: principal
        shell: bash
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          set -euo pipefail

          principal="$(databricks current-user me --output json | jq -r '.userName // empty')"
          test -n "$principal"
          echo "principal=$principal" >> "$GITHUB_OUTPUT"

      - name: Validate extracted Databricks bundle
        shell: bash
        working-directory: bundle-source
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          BUNDLE_TARGET: ${{ needs.resolve-context.outputs.bundle_target }}
        run: |
          set -euo pipefail
          databricks bundle validate --target "$BUNDLE_TARGET"

      - name: Initialize deployment attempt
        id: attempt
        shell: bash
        run: |
          set -euo pipefail

          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          deployment_id="github-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-${{ needs.resolve-context.outputs.target_environment }}"

          cat > "$RUNNER_TEMP/deployment-outcome.env" <<EOF
          OPERATION_STATUS=FAILED
          OPERATION_EXIT_CODE=1
          FAILURE_REASON=UNKNOWN_DEPLOYMENT_FAILURE
          STARTED_AT=$started_at
          COMPLETED_AT=$started_at
          EOF

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Deploy Databricks bundle and capture outcome
        id: deploy-command
        continue-on-error: true
        shell: bash
        working-directory: bundle-source
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          BUNDLE_TARGET: ${{ needs.resolve-context.outputs.bundle_target }}
        run: |
          set +e

          outcome_file="$RUNNER_TEMP/deployment-outcome.env"
          started_at="${{ steps.attempt.outputs.started_at }}"

          record_cancelled() {
            completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            cat > "$outcome_file" <<EOF
          OPERATION_STATUS=FAILED
          OPERATION_EXIT_CODE=130
          FAILURE_REASON=DEPLOY_CANCELLED
          STARTED_AT=$started_at
          COMPLETED_AT=$completed_at
          EOF
            exit 130
          }

          trap record_cancelled INT TERM

          timeout \
            --signal=TERM \
            --kill-after=30s \
            "${DEPLOY_TIMEOUT_SECONDS}s" \
            databricks bundle deploy --target "$BUNDLE_TARGET"
          exit_code=$?
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          case "$exit_code" in
            0)
              operation_status="SUCCESS"
              failure_reason=""
              ;;
            124|137)
              operation_status="FAILED"
              failure_reason="DEPLOY_TIMEOUT"
              ;;
            130|143)
              operation_status="FAILED"
              failure_reason="DEPLOY_CANCELLED"
              ;;
            *)
              operation_status="FAILED"
              failure_reason="DEPLOY_COMMAND_FAILED"
              ;;
          esac

          cat > "$outcome_file" <<EOF
          OPERATION_STATUS=$operation_status
          OPERATION_EXIT_CODE=$exit_code
          FAILURE_REASON=$failure_reason
          STARTED_AT=$started_at
          COMPLETED_AT=$completed_at
          EOF

          # Keep this step non-fatal. Evidence publication and the final gate
          # decide the workflow result after the outcome has been recorded.
          exit 0

      - name: Normalize deployment outcome
        id: outcome
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          outcome_file="$RUNNER_TEMP/deployment-outcome.env"
          test -f "$outcome_file"
          source "$outcome_file"

          case "$OPERATION_STATUS" in
            SUCCESS)
              test "$OPERATION_EXIT_CODE" = "0"
              FAILURE_REASON=""
              ;;
            FAILED)
              if ! [[ "$OPERATION_EXIT_CODE" =~ ^[1-9][0-9]*$ ]]; then
                OPERATION_EXIT_CODE=1
                FAILURE_REASON=UNKNOWN_DEPLOYMENT_FAILURE
              fi
              case "$FAILURE_REASON" in
                DEPLOY_COMMAND_FAILED|DEPLOY_TIMEOUT|DEPLOY_CANCELLED|UNKNOWN_DEPLOYMENT_FAILURE) ;;
                *) FAILURE_REASON=UNKNOWN_DEPLOYMENT_FAILURE ;;
              esac
              ;;
            *)
              OPERATION_STATUS=FAILED
              OPERATION_EXIT_CODE=1
              FAILURE_REASON=UNKNOWN_DEPLOYMENT_FAILURE
              ;;
          esac

          echo "operation_status=$OPERATION_STATUS" >> "$GITHUB_OUTPUT"
          echo "operation_exit_code=$OPERATION_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "failure_reason=$FAILURE_REASON" >> "$GITHUB_OUTPUT"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          echo "completed_at=$COMPLETED_AT" >> "$GITHUB_OUTPUT"

      - name: Generate historical deployment evidence
        if: ${{ always() && steps.outcome.outcome == 'success' }}
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ needs.resolve-context.outputs.target_environment }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
          ARTIFACT_HASH: ${{ needs.verify-release.outputs.artifact_hash }}
          BUNDLE_TARGET: ${{ needs.resolve-context.outputs.bundle_target }}
          WORKSPACE_TARGET: ${{ needs.resolve-context.outputs.workspace_target }}
          SOURCE_BRANCH: ${{ needs.verify-release.outputs.source_branch }}
          TARGET_BRANCH: ${{ needs.resolve-context.outputs.target_branch }}
          COMMIT_SHA: ${{ needs.verify-release.outputs.commit_sha }}
          AUTHENTICATED_PRINCIPAL: ${{ steps.principal.outputs.principal }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          OPERATION_STATUS: ${{ steps.outcome.outputs.operation_status }}
          OPERATION_EXIT_CODE: ${{ steps.outcome.outputs.operation_exit_code }}
          FAILURE_REASON: ${{ steps.outcome.outputs.failure_reason }}
          STARTED_AT: ${{ steps.outcome.outputs.started_at }}
        run: |
          set -euo pipefail

          workspace_root_path="/Workspace/Users/${AUTHENTICATED_PRINCIPAL}/.bundle/${BUNDLE_NAME}/${BUNDLE_TARGET}"

          command=(
            python scripts/deployment_manifest.py
            --deployment-id "${{ steps.attempt.outputs.deployment_id }}"
            --environment "$TARGET_ENVIRONMENT"
            --release-id "$RELEASE_ID"
            --artifact-name "$ARTIFACT_NAME"
            --artifact-hash "$ARTIFACT_HASH"
            --bundle-name "$BUNDLE_NAME"
            --bundle-target "$BUNDLE_TARGET"
            --workspace-target "$WORKSPACE_TARGET"
            --workspace-root-path "$workspace_root_path"
            --authenticated-principal "$AUTHENTICATED_PRINCIPAL"
            --started-at "$STARTED_AT"
            --operation-status "$OPERATION_STATUS"
            --operation-exit-code "$OPERATION_EXIT_CODE"
            --source-branch "$SOURCE_BRANCH"
            --target-branch "$TARGET_BRANCH"
            --commit-sha "$COMMIT_SHA"
            --commit-message "Deploy immutable release $RELEASE_ID"
            --github-repository "$GITHUB_REPOSITORY"
            --github-actor "$GITHUB_ACTOR"
            --github-workflow "$GITHUB_WORKFLOW"
            --github-run-id "$GITHUB_RUN_ID"
            --github-run-number "$GITHUB_RUN_NUMBER"
            --github-run-attempt "$GITHUB_RUN_ATTEMPT"
            --github-job "$GITHUB_JOB"
            --github-event-name "$GITHUB_EVENT_NAME"
            --evidence-role historical
            --databricks-host "$DATABRICKS_HOST"
            --output-directory "$EVIDENCE_DIR"
          )

          if [[ "$OPERATION_STATUS" = "FAILED" ]]; then
            command+=(--failure-reason "$FAILURE_REASON")
          fi

          "${command[@]}"

          test -f "$EVIDENCE_DIR/${{ needs.resolve-context.outputs.historical_manifest_name }}"
          jq . "$EVIDENCE_DIR/${{ needs.resolve-context.outputs.historical_manifest_name }}"

      - name: Upload immutable historical deployment evidence
        id: upload-historical
        if: ${{ always() && steps.outcome.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          HISTORICAL_MANIFEST_NAME: ${{ needs.resolve-context.outputs.historical_manifest_name }}
        run: |
          set -euo pipefail
          evidence_path="$EVIDENCE_DIR/$HISTORICAL_MANIFEST_NAME"
          test -f "$evidence_path"

          # No --clobber: historical evidence is immutable.
          gh release upload "$RELEASE_ID" "$evidence_path" \
            --repo "$GITHUB_REPOSITORY"

      - name: Generate canonical deployment evidence
        if: ${{ always() && steps.outcome.outputs.operation_status == 'SUCCESS' && steps.upload-historical.outcome == 'success' }}
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ needs.resolve-context.outputs.target_environment }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
          ARTIFACT_HASH: ${{ needs.verify-release.outputs.artifact_hash }}
          BUNDLE_TARGET: ${{ needs.resolve-context.outputs.bundle_target }}
          WORKSPACE_TARGET: ${{ needs.resolve-context.outputs.workspace_target }}
          SOURCE_BRANCH: ${{ needs.verify-release.outputs.source_branch }}
          TARGET_BRANCH: ${{ needs.resolve-context.outputs.target_branch }}
          COMMIT_SHA: ${{ needs.verify-release.outputs.commit_sha }}
          AUTHENTICATED_PRINCIPAL: ${{ steps.principal.outputs.principal }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          STARTED_AT: ${{ steps.outcome.outputs.started_at }}
        run: |
          set -euo pipefail

          workspace_root_path="/Workspace/Users/${AUTHENTICATED_PRINCIPAL}/.bundle/${BUNDLE_NAME}/${BUNDLE_TARGET}"

          python scripts/deployment_manifest.py \
            --deployment-id "${{ steps.attempt.outputs.deployment_id }}" \
            --environment "$TARGET_ENVIRONMENT" \
            --release-id "$RELEASE_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-hash "$ARTIFACT_HASH" \
            --bundle-name "$BUNDLE_NAME" \
            --bundle-target "$BUNDLE_TARGET" \
            --workspace-target "$WORKSPACE_TARGET" \
            --workspace-root-path "$workspace_root_path" \
            --authenticated-principal "$AUTHENTICATED_PRINCIPAL" \
            --started-at "$STARTED_AT" \
            --operation-status SUCCESS \
            --operation-exit-code 0 \
            --source-branch "$SOURCE_BRANCH" \
            --target-branch "$TARGET_BRANCH" \
            --commit-sha "$COMMIT_SHA" \
            --commit-message "Deploy immutable release $RELEASE_ID" \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-actor "$GITHUB_ACTOR" \
            --github-workflow "$GITHUB_WORKFLOW" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-number "$GITHUB_RUN_NUMBER" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-job "$GITHUB_JOB" \
            --github-event-name "$GITHUB_EVENT_NAME" \
            --evidence-role canonical \
            --databricks-host "$DATABRICKS_HOST" \
            --output-directory "$EVIDENCE_DIR"

          test -f "$EVIDENCE_DIR/${{ needs.resolve-context.outputs.canonical_manifest_name }}"

      - name: Upload canonical deployment evidence
        id: upload-canonical
        if: ${{ always() && steps.outcome.outputs.operation_status == 'SUCCESS' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          CANONICAL_MANIFEST_NAME: ${{ needs.resolve-context.outputs.canonical_manifest_name }}
        run: |
          set -euo pipefail
          evidence_path="$EVIDENCE_DIR/$CANONICAL_MANIFEST_NAME"
          test -f "$evidence_path"

          # Canonical evidence represents the latest successful deployment.
          gh release upload "$RELEASE_ID" "$evidence_path" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Enforce final deployment result
        if: ${{ always() }}
        shell: bash
        env:
          OPERATION_STATUS: ${{ steps.outcome.outputs.operation_status }}
          OPERATION_EXIT_CODE: ${{ steps.outcome.outputs.operation_exit_code }}
          FAILURE_REASON: ${{ steps.outcome.outputs.failure_reason }}
        run: |
          set -euo pipefail

          if [[ "$OPERATION_STATUS" != "SUCCESS" ]]; then
            echo "Deployment failed after historical evidence publication." >&2
            echo "Exit code: $OPERATION_EXIT_CODE" >&2
            echo "Failure reason: $FAILURE_REASON" >&2
            exit 1
          fi

          if [[ "${{ steps.upload-historical.outcome }}" != "success" ]]; then
            echo "Historical deployment evidence was not published." >&2
            exit 1
          fi

          if [[ "${{ steps.upload-canonical.outcome }}" != "success" ]]; then
            echo "Canonical deployment evidence was not published." >&2
            exit 1
          fi

          echo "Deployment succeeded and both evidence roles were published."

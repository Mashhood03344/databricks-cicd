name: Databricks Bundle CD

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable GitHub Release ID
        required: true
        type: string

      target_environment:
        description: Target deployment environment
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

jobs:
  resolve-context:
    name: Resolve CD Context
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      target_environment: ${{ steps.context.outputs.target_environment }}
      release_id: ${{ steps.context.outputs.release_id }}
      bundle_target: ${{ steps.context.outputs.bundle_target }}
      github_environment: ${{ steps.context.outputs.github_environment }}
      workspace_target: ${{ steps.context.outputs.workspace_target }}
      previous_environment: ${{ steps.context.outputs.previous_environment }}
      previous_manifest_path: ${{ steps.context.outputs.previous_manifest_path }}
      deployment_manifest_name: ${{ steps.context.outputs.deployment_manifest_name }}

    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@v4

      - name: Resolve CD context
        id: context
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/cd_resolve_context.sh

          scripts/cd_resolve_context.sh \
            "${{ inputs.target_environment }}" \
            "${{ inputs.release_id }}" \
            >> "$GITHUB_OUTPUT"

  verify-release:
    name: Download and Verify Immutable Release
    runs-on: ubuntu-latest
    needs:
      - resolve-context

    permissions:
      contents: read

    outputs:
      release_id: ${{ steps.verify.outputs.release_id }}
      artifact_name: ${{ steps.verify.outputs.artifact_name }}
      artifact_hash: ${{ steps.verify.outputs.artifact_hash }}
      release_asset_name: ${{ steps.verify.outputs.release_asset_name }}
      repository: ${{ steps.verify.outputs.repository }}
      source_branch: ${{ steps.verify.outputs.source_branch }}
      commit_sha: ${{ steps.verify.outputs.commit_sha }}
      workflow_run_id: ${{ steps.verify.outputs.workflow_run_id }}
      workflow_run_number: ${{ steps.verify.outputs.workflow_run_number }}
      created_at_utc: ${{ steps.verify.outputs.created_at_utc }}

    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@v4

      - name: Create release download directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-package

      - name: Download immutable GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.resolve-context.outputs.release_id }}
          ARTIFACT_NAME: ${{ needs.resolve-context.outputs.release_id }}.zip
        run: |
          set -euo pipefail

          gh release download "${RELEASE_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-package \
            --pattern "${ARTIFACT_NAME}" \
            --pattern "release_manifest.json"

          test -f "release-package/${ARTIFACT_NAME}"

          test -f "release-package/release_manifest.json"

          echo "Release artifact and release manifest downloaded successfully."

      - name: Display downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-package -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Verify release manifest and artifact
        id: verify
        shell: bash
        env:
          RELEASE_ID: ${{ needs.resolve-context.outputs.release_id }}
        run: |
          set -euo pipefail

          chmod +x scripts/cd_verify_release_manifest.sh

          verification_output="$(
            scripts/cd_verify_release_manifest.sh \
              "release-package/release_manifest.json" \
              "${RELEASE_ID}"
          )"

          printf '%s\n' "${verification_output}"

          printf '%s\n' "${verification_output}" \
            | grep -E '^[a-z_]+=' \
            >> "$GITHUB_OUTPUT"

      - name: Confirm verified release identity
        shell: bash
        env:
          VERIFIED_RELEASE_ID: ${{ steps.verify.outputs.release_id }}
          VERIFIED_ARTIFACT_NAME: ${{ steps.verify.outputs.artifact_name }}
          VERIFIED_ARTIFACT_HASH: ${{ steps.verify.outputs.artifact_hash }}
        run: |
          set -euo pipefail

          echo "Verified release ID: ${VERIFIED_RELEASE_ID}"
          echo "Verified artifact name: ${VERIFIED_ARTIFACT_NAME}"
          echo "Verified artifact hash: ${VERIFIED_ARTIFACT_HASH}"

  validate-promotion:
    name: Validate Release Promotion
    runs-on: ubuntu-latest

    needs:
      - resolve-context
      - verify-release

    permissions:
      contents: read

    outputs:
      decision: ${{ steps.read-result.outputs.decision }}
      valid: ${{ steps.read-result.outputs.valid }}
      result_file: ${{ steps.read-result.outputs.result_file }}

    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@v4

      - name: Download previous deployment evidence
        if: needs.resolve-context.outputs.previous_environment != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          PREVIOUS_MANIFEST_PATH: ${{ needs.resolve-context.outputs.previous_manifest_path }}
        run: |
          set -euo pipefail

          gh release download "${RELEASE_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir . \
            --pattern "${PREVIOUS_MANIFEST_PATH}"

          test -f "${PREVIOUS_MANIFEST_PATH}"

          echo "Downloaded previous deployment evidence:"
          echo "${PREVIOUS_MANIFEST_PATH}"

      - name: Run promotion validator
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ needs.resolve-context.outputs.target_environment }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          ARTIFACT_HASH: ${{ needs.verify-release.outputs.artifact_hash }}
          PREVIOUS_MANIFEST_PATH: ${{ needs.resolve-context.outputs.previous_manifest_path }}
        run: |
          set -euo pipefail

          validator_command=(
            python scripts/promotion_validator.py
            --target-environment "${TARGET_ENVIRONMENT}"
            --release-id "${RELEASE_ID}"
            --artifact-hash "${ARTIFACT_HASH}"
          )

          if [ -n "${PREVIOUS_MANIFEST_PATH}" ]; then
            validator_command+=(
              --previous-manifest-path "${PREVIOUS_MANIFEST_PATH}"
            )
          fi

          printf 'Running promotion validation for environment: %s\n' \
            "${TARGET_ENVIRONMENT}"

          "${validator_command[@]}"

      - name: Read promotion validation result
        id: read-result
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ needs.resolve-context.outputs.target_environment }}
        run: |
          set -euo pipefail

          RESULT_FILE="${TARGET_ENVIRONMENT}-promotion-validation-result.json"

          if [ ! -f "${RESULT_FILE}" ]; then
            echo "Promotion validation result was not created: ${RESULT_FILE}" >&2
            exit 1
          fi

          DECISION="$(jq -r '.decision // empty' "${RESULT_FILE}")"
          VALID="$(jq -r '.valid // empty' "${RESULT_FILE}")"

          if [ -z "${DECISION}" ]; then
            echo "Promotion decision is missing from ${RESULT_FILE}" >&2
            exit 1
          fi

          if [ "${VALID}" != "true" ] && [ "${VALID}" != "false" ]; then
            echo "Promotion valid field is invalid: ${VALID}" >&2
            exit 1
          fi

          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          echo "valid=${VALID}" >> "$GITHUB_OUTPUT"
          echo "result_file=${RESULT_FILE}" >> "$GITHUB_OUTPUT"

          echo "Promotion decision: ${DECISION}"
          echo "Promotion valid: ${VALID}"

          if [ "${VALID}" != "true" ]; then
            echo "Promotion validation did not approve deployment." >&2
            exit 1
          fi

      - name: Display promotion validation checks
        shell: bash
        env:
          RESULT_FILE: ${{ steps.read-result.outputs.result_file }}
        run: |
          set -euo pipefail

          test -n "${RESULT_FILE}"
          test -f "${RESULT_FILE}"

          jq '{
            decision,
            valid,
            target_environment,
            release_id,
            artifact_hash,
            previous_environment,
            message,
            checks
          }' "${RESULT_FILE}"

  validate-and-deploy-bundle:
    name: Extract, Validate and Deploy Databricks Bundle
    runs-on: ubuntu-latest

    needs:
      - resolve-context
      - verify-release
      - validate-promotion

    permissions:
      contents: write

    environment: ${{ needs.resolve-context.outputs.github_environment }}

    steps:
      - name: Checkout trusted repository scripts
        uses: actions/checkout@v4

      - name: Create bundle working directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-package
          mkdir -p bundle-source

      - name: Download immutable release for deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
        run: |
          set -euo pipefail

          gh release download "${RELEASE_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-package \
            --pattern "${ARTIFACT_NAME}" \
            --pattern "release_manifest.json"

          test -f "release-package/${ARTIFACT_NAME}"
          test -f "release-package/release_manifest.json"

          echo "Downloaded deployment artifact: ${ARTIFACT_NAME}"
          echo "Downloaded release manifest: release_manifest.json"

      - name: Reverify release on deployment runner
        id: deployment-verification
        shell: bash
        env:
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
        run: |
          set -euo pipefail

          chmod +x scripts/cd_verify_release_manifest.sh

          verification_output="$(
            scripts/cd_verify_release_manifest.sh \
              "release-package/release_manifest.json" \
              "${RELEASE_ID}"
          )"

          printf '%s\n' "${verification_output}"

          printf '%s\n' "${verification_output}" \
            | grep -E '^[a-z_]+=' \
            >> "$GITHUB_OUTPUT"


      - name: Confirm deployment artifact matches approved release
        shell: bash
        env:
          APPROVED_RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          APPROVED_ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
          APPROVED_ARTIFACT_HASH: ${{ needs.verify-release.outputs.artifact_hash }}
          DEPLOYMENT_RELEASE_ID: ${{ steps.deployment-verification.outputs.release_id }}
          DEPLOYMENT_ARTIFACT_NAME: ${{ steps.deployment-verification.outputs.artifact_name }}
          DEPLOYMENT_ARTIFACT_HASH: ${{ steps.deployment-verification.outputs.artifact_hash }}
        run: |
          set -euo pipefail

          if [ "${DEPLOYMENT_RELEASE_ID}" != "${APPROVED_RELEASE_ID}" ]; then
            echo "Deployment release ID does not match the approved release ID." >&2
            echo "Approved:   ${APPROVED_RELEASE_ID}" >&2
            echo "Downloaded: ${DEPLOYMENT_RELEASE_ID}" >&2
            exit 1
          fi

          if [ "${DEPLOYMENT_ARTIFACT_NAME}" != "${APPROVED_ARTIFACT_NAME}" ]; then
            echo "Deployment artifact name does not match the approved artifact name." >&2
            echo "Approved:   ${APPROVED_ARTIFACT_NAME}" >&2
            echo "Downloaded: ${DEPLOYMENT_ARTIFACT_NAME}" >&2
            exit 1
          fi

          if [ "${DEPLOYMENT_ARTIFACT_HASH}" != "${APPROVED_ARTIFACT_HASH}" ]; then
            echo "Deployment artifact hash does not match the approved artifact hash." >&2
            echo "Approved:   ${APPROVED_ARTIFACT_HASH}" >&2
            echo "Downloaded: ${DEPLOYMENT_ARTIFACT_HASH}" >&2
            exit 1
          fi

          echo "Deployment release identity confirmed."
          echo "Release ID: ${DEPLOYMENT_RELEASE_ID}"
          echo "Artifact: ${DEPLOYMENT_ARTIFACT_NAME}"
          echo "Hash: ${DEPLOYMENT_ARTIFACT_HASH}"


      - name: Extract immutable release artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
        run: |
          set -euo pipefail

          unzip -q \
            "release-package/${ARTIFACT_NAME}" \
            -d bundle-source

          echo "Extracted immutable release artifact."

      - name: Validate extracted bundle structure
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "bundle-source/databricks.yml" ]; then
            echo "databricks.yml was not found in the immutable release artifact." >&2
            exit 1
          fi

          echo "Bundle configuration found:"
          echo "bundle-source/databricks.yml"

          find bundle-source \
            -maxdepth 2 \
            -type f \
            -printf '%P\n' \
            | sort

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Display Databricks CLI version
        shell: bash
        run: |
          set -euo pipefail

          databricks version

      - name: Validate Databricks authentication
        shell: bash
        working-directory: bundle-source
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          set -euo pipefail

          databricks current-user me \
            --output json \
            | jq '{
                userName,
                displayName,
                active
              }'

      - name: Validate Databricks bundle
        shell: bash
        working-directory: bundle-source
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          BUNDLE_TARGET: ${{ needs.resolve-context.outputs.bundle_target }}
        run: |
          set -euo pipefail

          databricks bundle validate \
            --target "${BUNDLE_TARGET}"


      - name: Capture deployment start time
        id: deployment-start
        shell: bash
        run: |
          set -euo pipefail

          STARTED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          echo "started_at=${STARTED_AT}" >> "$GITHUB_OUTPUT"


      - name: Deploy Databricks bundle
        shell: bash
        working-directory: bundle-source
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          BUNDLE_TARGET: ${{ needs.resolve-context.outputs.bundle_target }}
        run: |
          set -euo pipefail

          databricks bundle deploy \
            --target "${BUNDLE_TARGET}"

          echo "Databricks bundle deployment completed for target: ${BUNDLE_TARGET}"


      - name: Resolve authenticated principal
        id: principal
        shell: bash
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
        run: |
          set -euo pipefail

          PRINCIPAL="$(
            databricks current-user me \
              --output json \
              | jq -r '.userName'
          )"

          if [ -z "${PRINCIPAL}" ] || [ "${PRINCIPAL}" = "null" ]; then
            echo "Unable to resolve authenticated principal." >&2
            exit 1
          fi

          echo "principal=${PRINCIPAL}" >> "$GITHUB_OUTPUT"


      - name: Generate deployment manifest
        shell: bash
        working-directory: bundle-source
        env:
          TARGET_ENVIRONMENT: ${{ needs.resolve-context.outputs.target_environment }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          ARTIFACT_NAME: ${{ needs.verify-release.outputs.artifact_name }}
          ARTIFACT_HASH: ${{ needs.verify-release.outputs.artifact_hash }}
          BUNDLE_TARGET: ${{ needs.resolve-context.outputs.bundle_target }}
          WORKSPACE_TARGET: ${{ needs.resolve-context.outputs.workspace_target }}
          DEPLOYMENT_MANIFEST_NAME: ${{ needs.resolve-context.outputs.deployment_manifest_name }}
          STARTED_AT: ${{ steps.deployment-start.outputs.started_at }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          AUTHENTICATED_PRINCIPAL: ${{ steps.principal.outputs.principal }}
        run: |
          set -euo pipefail

          echo "=== Deployment manifest runtime diagnostics ==="

          echo "Current directory:"
          pwd

          echo "Repository commit:"
          git rev-parse HEAD || true

          echo "Script absolute path:"
          realpath scripts/deployment_manifest.py

          echo "Retention parser implementation:"
          grep -n -A8 -B3 \
            "evidence-artifact-retention-days" \
            scripts/deployment_manifest.py

          echo "optional_int implementation:"
          grep -n -A15 \
            "def optional_int" \
            scripts/deployment_manifest.py || true

          echo "CLI help:"
          python scripts/deployment_manifest.py --help

          DEPLOYMENT_ID="github-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-${TARGET_ENVIRONMENT}"

          case "${TARGET_ENVIRONMENT}" in
            dev)
              TARGET_BRANCH="dev"
              ;;
            uat)
              TARGET_BRANCH="qa"
              ;;
            prod)
              TARGET_BRANCH="main"
              ;;
            *)
              echo "Unsupported target environment: ${TARGET_ENVIRONMENT}" >&2
              exit 1
              ;;
          esac

          echo "Resolved deployment branch mapping:"
          echo "Target environment: ${TARGET_ENVIRONMENT}"
          echo "Target branch: ${TARGET_BRANCH}"


          WORKSPACE_ROOT_PATH="/Workspace/Users/${AUTHENTICATED_PRINCIPAL}/.bundle/databricks-cicd-bundle-poc/${BUNDLE_TARGET}"

          python scripts/deployment_manifest.py \
            --deployment-id "${DEPLOYMENT_ID}" \
            --environment "${TARGET_ENVIRONMENT}" \
            --release-id "${RELEASE_ID}" \
            --artifact-name "${ARTIFACT_NAME}" \
            --artifact-hash "${ARTIFACT_HASH}" \
            --bundle-name "databricks-cicd-bundle-poc" \
            --bundle-target "${BUNDLE_TARGET}" \
            --workspace-target "${WORKSPACE_TARGET}" \
            --workspace-root-path "${WORKSPACE_ROOT_PATH}" \
            --authenticated-principal "${AUTHENTICATED_PRINCIPAL}" \
            --started-at "${STARTED_AT}" \
            --source-branch "${{ needs.verify-release.outputs.source_branch }}" \
            --target-branch "${TARGET_BRANCH}" \
            --commit-sha "${{ needs.verify-release.outputs.commit_sha }}" \
            --commit-message "Deploy immutable release ${RELEASE_ID}" \
            --github-repository "${{ needs.verify-release.outputs.repository }}" \
            --github-actor "${GITHUB_ACTOR}" \
            --github-workflow "${GITHUB_WORKFLOW}" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --github-run-number "${GITHUB_RUN_NUMBER}" \
            --github-job "${GITHUB_JOB}" \
            --github-event-name "${GITHUB_EVENT_NAME}" \
            --evidence-storage-type "github_release_asset" \
            --evidence-artifact-name "${DEPLOYMENT_MANIFEST_NAME}" \
            --evidence-artifact-version "1.0" \
            --evidence-artifact-retention-days null \
            --databricks-host "${DATABRICKS_HOST}" \
            --output-path "${DEPLOYMENT_MANIFEST_NAME}"

          test -f "${DEPLOYMENT_MANIFEST_NAME}"

          jq . "${DEPLOYMENT_MANIFEST_NAME}"


      - name: Upload deployment manifest to GitHub Release
        shell: bash
        working-directory: bundle-source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          DEPLOYMENT_MANIFEST_NAME: ${{ needs.resolve-context.outputs.deployment_manifest_name }}
        run: |
          set -euo pipefail

          test -f "${DEPLOYMENT_MANIFEST_NAME}"

          gh release upload "${RELEASE_ID}" \
            "${DEPLOYMENT_MANIFEST_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          echo "Uploaded deployment evidence to GitHub Release."
          echo "Release ID: ${RELEASE_ID}"
          echo "Evidence asset: ${DEPLOYMENT_MANIFEST_NAME}"


      - name: Verify deployment manifest publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-release.outputs.release_id }}
          DEPLOYMENT_MANIFEST_NAME: ${{ needs.resolve-context.outputs.deployment_manifest_name }}
        run: |
          set -euo pipefail

          LOCAL_MANIFEST="bundle-source/${DEPLOYMENT_MANIFEST_NAME}"
          VERIFICATION_DIRECTORY="deployment-evidence-verification"
          DOWNLOADED_MANIFEST="${VERIFICATION_DIRECTORY}/${DEPLOYMENT_MANIFEST_NAME}"

          test -f "${LOCAL_MANIFEST}"

          rm -rf "${VERIFICATION_DIRECTORY}"
          mkdir -p "${VERIFICATION_DIRECTORY}"

          gh release download "${RELEASE_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${VERIFICATION_DIRECTORY}" \
            --pattern "${DEPLOYMENT_MANIFEST_NAME}"

          test -f "${DOWNLOADED_MANIFEST}"

          if ! cmp --silent "${LOCAL_MANIFEST}" "${DOWNLOADED_MANIFEST}"; then
            echo "Published deployment manifest does not match the generated manifest." >&2
            exit 1
          fi

          echo "Deployment evidence publication verified."
          echo "Release ID: ${RELEASE_ID}"
          echo "Verified asset: ${DEPLOYMENT_MANIFEST_NAME}"

          jq '{
            schema_version,
            deployment_id,
            release,
            environment,
            promotion,
            evidence_storage,
            operation
          }' "${DOWNLOADED_MANIFEST}"
